[build-system]
requires = []
build-backend = "setuptools.build_meta"

[project]
name = "seo-site-scraper-pro"
version = "1.0.0"
description = "Professional desktop SEO crawler built with Python, CustomTkinter, asyncio, and aiohttp."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "SEO Site Scraper Pro" }]
dependencies = [
  "aiohttp>=3.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "customtkinter>=5.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "tldextract>=5.1",
  "validators>=0.22",
  "Pillow>=10.0",
  "networkx>=3.3",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
seo-site-scraper-pro = "seo_site_scraper_pro.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
